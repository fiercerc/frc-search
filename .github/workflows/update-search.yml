name: Update search

on:
  # Every 4 hours (stock on the search stays within about 4 hours of the store). The 08:15 UTC run is the nightly one, about 3:15 AM Central.
  schedule:
    - cron: '15 0,4,8,12,16,20 * * *'
  # The "Run workflow" button (your "Run now").
  workflow_dispatch:
  # Any change to the search code publishes right away.
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: update-search
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub switches scheduled runs off in a public repository after 60 days with no activity. Re-enabling this workflow
      # on every run restarts that clock, so the product list keeps updating even if nobody touches the code for months.
      - name: Keep the schedule switched on
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-search.yml/enable"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull products from Shift4Shop
        env:
          S4S_SECURE_URL: ${{ secrets.S4S_SECURE_URL || 'https://fiercercsolutions.com' }}
          S4S_PRIVATE_KEY: ${{ secrets.S4S_PRIVATE_KEY }}
          S4S_TOKEN: ${{ secrets.S4S_TOKEN }}
        run: |
          if [ -n "$S4S_PRIVATE_KEY" ] && [ -n "$S4S_TOKEN" ] && [ -n "$S4S_SECURE_URL" ]; then
            python build/fetch_products.py site/frc-index.js
          else
            echo "Shift4Shop keys not set yet - publishing the saved product list."
            cp data/frc-index.js site/frc-index.js
          fi

      - name: Apply settings from the Google Sheet
        run: python build/sheet_settings.py site/frc-index.js

      - name: Check the product list before publishing
        run: |
          node test/engine.test.js
          node test/prefix.test.js
          node test/verify_index.js site/frc-index.js
          node test/brand_sweep.js site/frc-index.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
