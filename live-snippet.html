<!-- Fierce RC Search. Loads for every visitor. Emergency off: open the store with ?frcs=off (turn back on with ?frcs=on). -->
<script>
(function () {
  try {
    var m = location.search.match(/(\?|&)frcs=(on|off)\b/);
    if (m) localStorage.setItem('frcs-off', m.pop() === 'off' ? '1' : '0');
    if (localStorage.getItem('frcs-off') === '1') return;
  } catch (e) { return; }
  var base = 'https://fiercerc.github.io/frc-search/';
  var ver = Math.floor(Date.now() / 600000); // refresh files at most every 10 minutes
  var css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = base + 'frc-search.css?v=' + ver;
  document.head.appendChild(css);
  window.FRCS_MANUAL = true;
  window.FRCS_CONFIG = { indexUrl: base + 'frc-index.js?v=' + ver, inputSelector: '#frcs-q', resultsMount: '#frcs-results', fonts: false };

  // Search page: hide FusionBot's results the moment this runs (the page is already built here) so shoppers
  // never see them flash before the new results appear. They come back on their own if the new search can't load.
  var early = null;
  function claimResults() {
    if (location.pathname !== '/search.html') return;
    Array.prototype.forEach.call(document.getElementsByTagName('span'), function (el) {
      if (/^\s*FusionBot Search Results\s*$/.test(el.textContent)) el.textContent = 'Search Results';
    });
    if (early) return;
    var fb = document.getElementById('fusionbot-content');
    if (!fb || document.getElementById('frcs-results')) return;
    var row = fb;
    while (row && !(row.classList && row.classList.contains('row'))) row = row.parentNode;
    var target = row || fb.parentNode;
    var mount = document.createElement('div');
    mount.id = 'frcs-results'; mount.style.padding = '0 15px';
    mount.innerHTML = '<p data-frcs-wait="1" style="margin:0;padding:48px 0;text-align:center;color:#666;font:14px Roboto,Arial,sans-serif">Loading results...</p>';
    target.parentNode.insertBefore(mount, target);
    target.style.display = 'none';
    early = { target: target, mount: mount };
  }
  function giveBack() {
    if (!early) return;
    early.target.style.display = '';
    if (early.mount.parentNode) early.mount.parentNode.removeChild(early.mount);
    early = null;
  }
  claimResults();

  function swap() {
    // Take the header search box away from FusionBot.
    var box = document.getElementById('searchBox');
    if (box && !document.getElementById('frcs-q')) {
      var fresh = box.cloneNode(true);
      box.parentNode.replaceChild(fresh, box);
      var inp = fresh.getElementsByTagName('input').item(0);
      if (inp) { inp.id = 'frcs-q'; inp.className = inp.className.replace(/\bsearchlight\b/g, ''); }
    }
    Array.prototype.forEach.call(document.querySelectorAll('.searchlight-balloon'), function (b) { b.parentNode.removeChild(b); });
    claimResults();
    var s = document.createElement('script');
    s.src = base + 'frc-search.js?v=' + ver;
    s.onload = function () {
      try { if (!window.FRCSearch) throw 0; window.FRCSearch.init(); } catch (e) { giveBack(); }
    };
    s.onerror = giveBack;
    document.body.appendChild(s);
    // Safety net: if the new results never appear, show FusionBot's again.
    setTimeout(function () { if (early && early.mount.querySelector('[data-frcs-wait]')) giveBack(); }, 15000);
  }
  if (document.readyState === 'complete') swap();
  else window.addEventListener('load', swap);
})();
</script>
<!-- end Fierce RC Search -->
